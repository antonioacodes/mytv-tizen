<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: http: data:; img-src 'self' https: http: data:; media-src 'self' https: http: blob:; connect-src 'self' https: http:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
  <title>MyTV</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/outfit_regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/outfit_semibold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/outfit_bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles/app.css">
  <style>
    .live-preview{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
    .live-preview>.live-video-wrap{grid-column:1/-1}
    .live-preview>.live-channel-info{grid-column:1;min-height:74px;margin-top:12px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(23,31,42,.82)}
    .live-preview>.live-epg{display:contents}
    .live-preview .live-on-air{grid-column:2;min-height:74px;margin-top:12px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(23,31,42,.82)}
    .live-preview .live-epg h3{grid-column:1/-1;margin:18px 0 8px}
    .live-preview .live-upcoming{grid-column:1/-1}
    @media (max-width:1100px){.live-preview{display:block}.live-preview>.live-epg{display:block}.live-preview .live-on-air{margin-top:12px}.live-preview .live-epg h3{margin-top:12px}}
    .favorite-channel-card{padding:0;background:transparent;border-radius:0;text-align:left}
    .favorite-channel-card img{width:160px;height:90px;box-sizing:border-box;margin:0;padding:12px;border-radius:10px;background:var(--surface-alt);object-fit:contain}
    .favorite-channel-card b{margin-top:8px}
    .favorite-channel-card:focus{border-color:transparent;box-shadow:none}.favorite-channel-card:focus img{box-shadow:0 0 0 4px rgba(61,222,255,.30)}
    .live-grid{grid-template-columns:minmax(0,1.4fr) minmax(330px,.86fr)}.live-preview{min-width:0;max-width:100%;overflow:hidden}.live-video-wrap{width:100%;max-width:100%;min-width:0}.live-upcoming{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));width:100%}.live-upcoming article{min-width:0;flex:auto}
    .hub-card{width:220px;height:104px}.hub-card img{object-position:center center}.media-card:focus{border-color:transparent;box-shadow:none;transform:none}.media-card:focus .media-poster{box-shadow:0 0 0 4px rgba(61,222,255,.42)}
    .vod-menu-card.vod-episodes-menu{width:min(1180px,88vw);max-height:62vh}.vod-episodes-menu .vod-menu-options{display:flex;gap:14px;overflow-x:auto;padding:5px}.vod-episode-card{display:flex!important;flex:0 0 220px!important;width:220px!important;height:128px!important;flex-direction:column!important;align-items:flex-start;justify-content:flex-end;border:2px solid transparent!important;background:#16202c center/cover!important;padding:13px!important;text-shadow:0 2px 8px #000}.vod-episode-card span{display:block;margin-top:4px;color:#d9dce4;font-size:12px;text-align:left}.vod-episode-card:focus{border-color:var(--primary)!important;box-shadow:0 0 0 4px rgba(61,222,255,.3)}
    .vod-bottom-menu{display:none!important}.vod-menu-modal.is-open{display:block;inset:auto 0 0;height:48%;padding:28px 38px;background:rgba(14,12,18,.90);backdrop-filter:blur(5px)}.vod-menu-modal .vod-menu-card{width:100%;max-width:none;max-height:none;overflow:visible;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}.vod-menu-modal .vod-menu-card h2{font-size:24px}.vod-inline-settings{display:flex;gap:16px;margin-top:24px}.vod-inline-settings button{display:flex!important;min-width:170px!important;flex:0 0 170px;flex-direction:column!important;padding:13px 18px!important;background:#27282d!important}.vod-inline-settings button>b{display:flex;align-items:center;gap:8px}.vod-inline-settings svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.vod-inline-settings small{margin-top:3px;color:#c8cad0}
    .vod-bottom-panel h2{margin:0 0 12px!important;font-size:18px!important}.vod-panel-episodes{display:flex;gap:16px;overflow-x:auto;padding:4px}.vod-panel-episode{position:relative;display:flex;flex:0 0 clamp(190px,16vw,260px);width:clamp(190px,16vw,260px);height:112px;flex-direction:column;align-items:flex-start;justify-content:flex-end;overflow:hidden;border:2px solid transparent;border-radius:10px;background:#18212b center/cover;color:#fff;padding:10px;text-align:left}.vod-panel-episode:after{content:'';position:absolute;z-index:0;inset:0;background:linear-gradient(180deg,rgba(3,8,18,.16),rgba(3,8,18,.82))}.vod-panel-episode>*{position:relative;z-index:1}.vod-panel-episode:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(61,222,255,.28)}.vod-panel-episode em{position:absolute;top:7px;right:7px;border-radius:4px;padding:4px 6px;background:var(--primary);color:#051018;font-size:9px;font-style:normal;font-weight:800}.vod-panel-episode em.done{background:#50c878}.vod-panel-episode .vod-episode-number{align-self:center;font-size:17px;font-weight:800;text-shadow:0 2px 5px #000}.vod-panel-episode>b{width:100%;margin-top:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.vod-panel-episode small{color:var(--primary);font-size:10px}.vod-panel-episode i{display:block;width:100%;height:4px;margin-top:5px;background:rgba(255,255,255,.28)}.vod-panel-episode i u{display:block;height:100%;background:var(--primary)}.vod-next{min-width:300px;text-align:left}.vod-next strong,.vod-next span,.vod-next small{display:block}.vod-next strong{font-size:15px}.vod-next span{max-width:360px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.vod-next small{margin-top:3px;opacity:.72;font-size:11px}
    .vod-panel-episode:after{inset:0;width:100%;height:100%;background:rgba(3,8,18,.58)}.vod-panel-episode-info{position:absolute!important;z-index:2!important;right:10px;bottom:10px;left:10px;display:block!important}.vod-panel-episode-info .vod-episode-number{display:block;font-size:16px!important;line-height:1.15;text-align:left}.vod-panel-episode-info>b{display:block;width:100%;margin-top:4px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.vod-panel-episode-info i{display:block;width:100%;height:4px;margin-top:7px;background:rgba(255,255,255,.30)}.vod-panel-episode-info i u{display:block;height:100%;background:var(--primary)}.episode-card .episode-progress{display:block;height:4px;margin-top:7px;background:rgba(255,255,255,.30)}.episode-card .episode-progress u{display:block;height:100%;background:var(--primary)}.episode-card small{color:var(--primary)!important}
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script src="scripts/app.js"></script>
</body>
</html>
